<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>脂硯齋重評石頭記 · 卷子本</title>
<link rel="stylesheet" href="style.css?v=20261111c">
</head>
<body data-theme="print">
<div id="app">

  <header id="bar">
    <div class="brand">
      <span class="brand-title">脂硯齋重評石頭記</span>
      <span class="brand-sub">卷子本</span>
    </div>

    <div class="nav">
      <button id="next" class="plaque" title="後卷（←）">後卷</button>
      <span id="vol" class="plaque">第一回</span>
      <button id="prev" class="plaque" title="前卷（→）">前卷</button>
    </div>

    <div class="tools">
      <button id="tocBtn" class="plaque">目錄</button>
      <button id="themeBtn" class="plaque" title="切換影印／現代">影印</button>
      <button id="notesBtn" class="plaque" title="批語篩選">批語·全部</button>
      <button id="colnoBtn" class="plaque on" title="列號">列號</button>
      <button id="minus" class="plaque" title="縮小字號">小字</button>
      <button id="plus" class="plaque" title="放大字號">大字</button>
    </div>
  </header>

  <main id="scroll">
    <div id="strip"></div>
  </main>

  <footer id="status">
    <span id="pos" class="plaque">第一回</span>
    <span id="pct">0%</span>
    <div id="bar-progress"><i></i></div>
    <span id="hint" class="plaque">滾輪 · 拖動 · 左右鍵</span>
  </footer>

  <div id="legend" title="批語來源"></div>

  <aside id="toc" hidden>
    <div class="toc-head">
      <strong>總目 · 八十卷</strong>
      <button id="tocClose">×</button>
    </div>
    <div id="tocList" class="toc-list"></div>
  </aside>
  <div id="shade" hidden></div>
</div>

<script src="data/book.js?v=20261111c"></script>
<script src="layout.js?v=20261111c"></script>
<script src="app.js?v=20261111c"></script>
</body>
</html>
